name: whatsapp-ai

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatsappai}
      POSTGRES_USER: ${POSTGRES_USER:-whatsappai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsappai} -d ${POSTGRES_DB:-whatsappai}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 30s

  migrate:
    build:
      context: .
      dockerfile: src/WhatsAppAI.WebApi/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-whatsappai};Username=${POSTGRES_USER:-whatsappai};Password=${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/efbundle", "--connection", "Host=postgres;Port=5432;Database=${POSTGRES_DB:-whatsappai};Username=${POSTGRES_USER:-whatsappai};Password=${POSTGRES_PASSWORD}"]

  api:
    build:
      context: .
      dockerfile: src/WhatsAppAI.WebApi/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-whatsappai};Username=${POSTGRES_USER:-whatsappai};Password=${POSTGRES_PASSWORD}"
      Persistence__ApplyMigrationsOnStartup: "false"
      DataProtection__KeysPath: /home/app/.aspnet/DataProtection-Keys
      DataProtection__CertificatePath: ${DataProtection__CertificatePath:?DataProtection__CertificatePath is required}
      DataProtection__CertificatePassword: ${DataProtection__CertificatePassword:?DataProtection__CertificatePassword is required}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "5000"
      Encryption__Key: ${Encryption__Key:?Encryption__Key is required}
      Jwt__Secret: ${Jwt__Secret:?Jwt__Secret is required}
      ForwardedHeaders__Enabled: ${ForwardedHeaders__Enabled:-true}
      ForwardedHeaders__KnownNetworks__0: ${ForwardedHeaders__KnownNetworks__0:-172.16.0.0/12}
      BootstrapAdmin__Email: ${BootstrapAdmin__Email:?BootstrapAdmin__Email is required}
      BootstrapAdmin__Password: ${BootstrapAdmin__Password:?BootstrapAdmin__Password is required}
      Meta__VerifyToken: ${Meta__VerifyToken:?Meta__VerifyToken is required}
      Meta__AppSecret: ${Meta__AppSecret:?Meta__AppSecret is required}
      WhatsAppWeb__Enabled: ${WhatsAppWeb__Enabled:-true}
      WhatsAppWeb__BaseUrl: http://whatsapp-web:3020
      WHATSAPP_WEB_WEBHOOK_SECRET: ${WHATSAPP_WEB_WEBHOOK_SECRET:?WHATSAPP_WEB_WEBHOOK_SECRET is required}
      Workers__Enabled: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
      - ${DATAPROTECTION_CERTIFICATE_FILE:?DATAPROTECTION_CERTIFICATE_FILE is required}:/run/secrets/dataprotection.pfx:ro

  worker:
    build:
      context: .
      dockerfile: src/WhatsAppAI.WebApi/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-whatsappai};Username=${POSTGRES_USER:-whatsappai};Password=${POSTGRES_PASSWORD}"
      Persistence__ApplyMigrationsOnStartup: "false"
      DataProtection__KeysPath: /home/app/.aspnet/DataProtection-Keys
      DataProtection__CertificatePath: ${DataProtection__CertificatePath:?DataProtection__CertificatePath is required}
      DataProtection__CertificatePassword: ${DataProtection__CertificatePassword:?DataProtection__CertificatePassword is required}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "5001"
      Encryption__Key: ${Encryption__Key:?Encryption__Key is required}
      Jwt__Secret: ${Jwt__Secret:?Jwt__Secret is required}
      ForwardedHeaders__Enabled: ${ForwardedHeaders__Enabled:-true}
      ForwardedHeaders__KnownNetworks__0: ${ForwardedHeaders__KnownNetworks__0:-172.16.0.0/12}
      BootstrapAdmin__Email: ${BootstrapAdmin__Email:?BootstrapAdmin__Email is required}
      BootstrapAdmin__Password: ${BootstrapAdmin__Password:?BootstrapAdmin__Password is required}
      Meta__VerifyToken: ${Meta__VerifyToken:?Meta__VerifyToken is required}
      Meta__AppSecret: ${Meta__AppSecret:?Meta__AppSecret is required}
      WhatsAppWeb__Enabled: ${WhatsAppWeb__Enabled:-true}
      WhatsAppWeb__BaseUrl: http://whatsapp-web:3020
      WHATSAPP_WEB_WEBHOOK_SECRET: ${WHATSAPP_WEB_WEBHOOK_SECRET:?WHATSAPP_WEB_WEBHOOK_SECRET is required}
      Workers__Enabled: "true"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    entrypoint: ["dotnet", "WhatsAppAI.WebApi.dll"]
    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
      - ${DATAPROTECTION_CERTIFICATE_FILE:?DATAPROTECTION_CERTIFICATE_FILE is required}:/run/secrets/dataprotection.pfx:ro
    profiles:
      - worker
      - production

  whatsapp-web:
    build:
      context: ./services/whatsapp-web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${ASPNETCORE_ENVIRONMENT:-Production}
      PORT: "3020"
      WHATSAPP_WEB_API_URL: http://api:5000/api/webhooks/whatsapp-web
      WHATSAPP_WEB_WEBHOOK_SECRET: ${WHATSAPP_WEB_WEBHOOK_SECRET:?WHATSAPP_WEB_WEBHOOK_SECRET is required}
      WHATSAPP_WEB_INSTANCE_ID: ${WHATSAPP_WEB_INSTANCE_ID:?WHATSAPP_WEB_INSTANCE_ID is required}
      WHATSAPP_WEB_INSTANCE_URL: ${WHATSAPP_WEB_INSTANCE_URL:?WHATSAPP_WEB_INSTANCE_URL is required}
    expose:
      - "3020"
    volumes:
      - whatsapp-web-sessions:/app/sessions
    depends_on:
      api:
        condition: service_started
    profiles:
      - production

  whatsapp-web-2:
    build:
      context: ./services/whatsapp-web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${ASPNETCORE_ENVIRONMENT:-Production}
      PORT: "3020"
      WHATSAPP_WEB_API_URL: http://api:5000/api/webhooks/whatsapp-web
      WHATSAPP_WEB_WEBHOOK_SECRET: ${WHATSAPP_WEB_WEBHOOK_SECRET:?WHATSAPP_WEB_WEBHOOK_SECRET is required}
      WHATSAPP_WEB_INSTANCE_ID: ${WHATSAPP_WEB_INSTANCE_2_ID:-whatsapp-web-2}
      WHATSAPP_WEB_INSTANCE_URL: ${WHATSAPP_WEB_INSTANCE_2_URL:-http://whatsapp-web-2:3020}
    expose:
      - "3020"
    volumes:
      - whatsapp-web-sessions-2:/app/sessions
    depends_on:
      api:
        condition: service_started
    profiles:
      - qr-scale

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    profiles:
      - frontend
      - production

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api
    profiles:
      - production

volumes:
  postgres-data:
  whatsapp-web-sessions:
  whatsapp-web-sessions-2:
  dataprotection-keys:
