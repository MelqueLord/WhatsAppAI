name: whatsapp-ai

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatsappai}
      POSTGRES_USER: ${POSTGRES_USER:-whatsappai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsappai} -d ${POSTGRES_DB:-whatsappai}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 30s

  migrate:
    build:
      context: .
      dockerfile: src/WhatsAppAI.WebApi/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-whatsappai};Username=${POSTGRES_USER:-whatsappai};Password=${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/efbundle", "--connection", "Host=postgres;Port=5432;Database=${POSTGRES_DB:-whatsappai};Username=${POSTGRES_USER:-whatsappai};Password=${POSTGRES_PASSWORD}"]

  api:
    build:
      context: .
      dockerfile: src/WhatsAppAI.WebApi/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-whatsappai};Username=${POSTGRES_USER:-whatsappai};Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: "http://+:5000"
      Encryption__Key: ${Encryption__Key:?Encryption__Key is required}
      Meta__VerifyToken: ${Meta__VerifyToken:?Meta__VerifyToken is required}
      Meta__AppSecret: ${Meta__AppSecret:?Meta__AppSecret is required}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5000:5000"

  worker:
    build:
      context: .
      dockerfile: src/WhatsAppAI.WebApi/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-whatsappai};Username=${POSTGRES_USER:-whatsappai};Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: "http://+:5001"
      Encryption__Key: ${Encryption__Key:?Encryption__Key is required}
      Meta__VerifyToken: ${Meta__VerifyToken:?Meta__VerifyToken is required}
      Meta__AppSecret: ${Meta__AppSecret:?Meta__AppSecret is required}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    entrypoint: ["dotnet", "WhatsAppAI.WebApi.dll", "--urls", "http://+:5001"]
    profiles:
      - worker

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    profiles:
      - frontend
      - production

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api
    profiles:
      - production

volumes:
  postgres-data:
