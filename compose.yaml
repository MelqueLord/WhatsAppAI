name: whatsapp-ai

services:
  mysql:
    image: mysql:8.4-lts
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
      --default-authentication-plugin=mysql_native_password

  migrate:
    build:
      context: .
      dockerfile: src/WhatsAppAI.WebApi/Dockerfile
    restart: unless-stopped
    environment:
      DatabaseProvider: MySQL
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4"
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/app/efbundle", "--connection", "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4"]

  api:
    build:
      context: .
      dockerfile: src/WhatsAppAI.WebApi/Dockerfile
    restart: unless-stopped
    environment:
      DatabaseProvider: MySQL
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: "http://+:5000"
      Encryption__Key: ${Encryption__Key:?Encryption__Key is required}
      Meta__VerifyToken: ${Meta__VerifyToken:?Meta__VerifyToken is required}
      Meta__AppSecret: ${Meta__AppSecret:?Meta__AppSecret is required}
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5000:5000"

  worker:
    build:
      context: .
      dockerfile: src/WhatsAppAI.WebApi/Dockerfile
    restart: unless-stopped
    environment:
      DatabaseProvider: MySQL
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: "http://+:5001"
      Encryption__Key: ${Encryption__Key:?Encryption__Key is required}
      Meta__VerifyToken: ${Meta__VerifyToken:?Meta__VerifyToken is required}
      Meta__AppSecret: ${Meta__AppSecret:?Meta__AppSecret is required}
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    entrypoint: ["dotnet", "WhatsAppAI.WebApi.dll", "--urls", "http://+:5001"]
    profiles:
      - worker

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    profiles:
      - frontend
      - production

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api
    profiles:
      - production

volumes:
  mysql-data:
