services:
  - type: web
    name: whatsappai-api
    runtime: docker
    dockerfilePath: ./src/WhatsAppAI.WebApi/Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_hostBuilder__reloadConfigOnChange
        value: "false"
      - key: Cors__AllowedOrigins__0
        value: https://whats-app-ai-red.vercel.app
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Encryption__Key
        generateValue: true
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: whatsappai
      - key: Jwt__Audience
        value: whatsappai
      - key: Meta__VerifyToken
        sync: false
      - key: Meta__AppSecret
        sync: false
      - key: WhatsAppWeb__Enabled
        value: "true"
      - key: WhatsAppWeb__BaseUrl
        value: https://whatsappai-whatsapp-web.onrender.com
      - key: WHATSAPP_WEB_WEBHOOK_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: ForwardedHeaders__Enabled
        value: "true"
      - key: ForwardedHeaders__TrustAll
        value: "true"

  - type: web
    name: whatsappai-whatsapp-web
    runtime: docker
    dockerfilePath: ./services/whatsapp-web/Dockerfile
    dockerContext: ./services/whatsapp-web
    buildFilter:
      paths:
        - services/whatsapp-web/**
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: WHATSAPP_WEB_API_URL
        value: https://whatsappai-api-u61i.onrender.com/api/webhooks/whatsapp-web
      - key: WHATSAPP_WEB_WEBHOOK_SECRET
        fromService:
          type: web
          name: whatsappai-api
          envVarKey: WHATSAPP_WEB_WEBHOOK_SECRET
