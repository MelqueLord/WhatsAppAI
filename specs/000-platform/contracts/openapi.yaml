openapi: 3.1.0
info:
  title: WhatsApp AI Manager API
  version: 0.3.0
  description: Contrato inicial do MVP. Endpoints autenticados usam sessão em cookie.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api
tags:
  - name: Auth
    description: Sessão e proteção antiforgery.
  - name: Administration
    description: Operações exclusivas de PlatformAdmin.
  - name: Operators
    description: Memberships Operator gerenciadas pelo TenantOwner do tenant corrente.
  - name: Conversations
    description: Inbox, mensagens, modos e mídia.
  - name: Knowledge
    description: Conhecimento ativo do tenant.
  - name: Integrations
    description: Configuração e diagnóstico Meta/OpenAI.
  - name: Usage
    description: Unidades e custos estimados.
  - name: Webhooks
    description: Entrada oficial da WhatsApp Cloud API.
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Iniciar sessão
      security: []
      x-requirements: [FR-001]
      parameters:
        - $ref: '#/components/parameters/AntiforgeryToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204': { description: Sessão iniciada }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Encerrar sessão
      x-requirements: [FR-001]
      parameters:
        - $ref: '#/components/parameters/AntiforgeryToken'
      responses:
        '204': { description: Sessão encerrada }
        '400': { $ref: '#/components/responses/Problem' }
  /auth/csrf:
    get:
      tags: [Auth]
      operationId: getAntiforgeryToken
      summary: Obter token antiforgery
      security: []
      x-requirements: [FR-001]
      responses:
        '200':
          description: Token antiforgery vinculado ao cookie emitido no mesmo site
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AntiforgeryToken' }
        '400': { $ref: '#/components/responses/Problem' }
  /auth/activate:
    post:
      tags: [Auth]
      operationId: activateAccount
      summary: Ativar conta convidada e definir senha
      security: []
      x-requirements: [US-008, FR-025, BR-013, BR-014]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateAccountRequest' }
      responses:
        '204': { description: Conta ativada; convite consumido }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentSession
      summary: Obter usuário, tenant, papel e permissões da sessão
      x-requirements: [FR-002, FR-027]
      responses:
        '200':
          description: Contexto sanitizado derivado da sessão atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentSession' }
        '401': { $ref: '#/components/responses/Problem' }
  /admin/tenants:
    get:
      tags: [Administration]
      operationId: listTenants
      summary: Listar tenants para administração
      x-requirements: [US-001, FR-002, FR-003]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Página de tenants visível ao PlatformAdmin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantPage' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Administration]
      operationId: createTenant
      summary: Criar tenant e proprietário
      x-requirements: [US-001, US-008, FR-002, FR-003, FR-019, FR-025, BR-013, BR-014]
      parameters:
        - $ref: '#/components/parameters/AntiforgeryToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenantRequest' }
      responses:
        '201':
          description: Tenant, proprietário convidado e link manual retornado uma única vez
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantProvisioningResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /operators:
    get:
      tags: [Operators]
      operationId: listOperators
      summary: Listar Operators do tenant corrente
      description: Requer papel TenantOwner; tenant é derivado da sessão.
      x-required-role: TenantOwner
      x-tenant-scoped: true
      x-requirements: [US-009, FR-002, FR-026, BR-012]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Página de memberships Operator do tenant corrente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /operators/invitations:
    post:
      tags: [Operators]
      operationId: inviteOperator
      summary: Convidar Operator
      description: Requer papel TenantOwner; tenant é derivado da sessão e o link deve ser entregue manualmente.
      x-required-role: TenantOwner
      x-tenant-scoped: true
      x-requirements: [US-009, FR-002, FR-025, FR-026, BR-012, BR-013, BR-014]
      parameters:
        - $ref: '#/components/parameters/AntiforgeryToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorInvitationRequest' }
      responses:
        '201':
          description: Membership convidada e link retornado uma única vez
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationIssued' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /operators/{membershipId}/deactivate:
    post:
      tags: [Operators]
      operationId: deactivateOperator
      summary: Desativar Operator e invalidar sessões
      description: Requer papel TenantOwner e membership Operator do tenant corrente.
      x-required-role: TenantOwner
      x-tenant-scoped: true
      x-requirements: [US-009, FR-002, FR-026, FR-028, BR-012, BR-015]
      parameters:
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AntiforgeryToken'
      responses:
        '200':
          description: Operator desativado e sessões anteriores invalidadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /operators/{membershipId}/reactivate:
    post:
      tags: [Operators]
      operationId: reactivateOperator
      summary: Reativar Operator
      description: Requer papel TenantOwner e membership Operator do tenant corrente; cookies antigos permanecem inválidos.
      x-required-role: TenantOwner
      x-tenant-scoped: true
      x-requirements: [US-009, FR-002, FR-026, FR-028, BR-012, BR-015]
      parameters:
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AntiforgeryToken'
      responses:
        '200':
          description: Operator reativado; novo login é necessário
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /operators/{membershipId}/resend-invitation:
    post:
      tags: [Operators]
      operationId: resendOperatorInvitation
      summary: Revogar convite anterior e emitir novo link
      description: Requer papel TenantOwner e membership Operator do tenant corrente; link é retornado uma única vez.
      x-required-role: TenantOwner
      x-tenant-scoped: true
      x-requirements: [US-009, FR-002, FR-025, FR-026, BR-012, BR-013, BR-014]
      parameters:
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AntiforgeryToken'
      responses:
        '201':
          description: Novo convite emitido e anteriores utilizáveis revogados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationIssued' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/tenants/{tenantId}/status:
    put:
      tags: [Administration]
      operationId: changeTenantStatus
      summary: Suspender ou reativar tenant
      x-requirements: [US-001, FR-002, FR-003, FR-019]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AntiforgeryToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeTenantStatusRequest' }
      responses:
        '200':
          description: Status alterado sem exclusão do histórico
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantSummary' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: Listar conversas por cursor
      x-requirements: [US-002, FR-008, FR-024]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: mode
          schema: { $ref: '#/components/schemas/ConversationMode' }
        - in: query
          name: state
          schema: { type: string, enum: [Open, Closed] }
      responses:
        '200':
          description: Página de conversas do tenant corrente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '401': { $ref: '#/components/responses/Problem' }
  /conversations/{conversationId}:
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Obter resumo da conversa
      x-requirements: [US-002, FR-008]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Resumo da conversa; mensagens são obtidas pelo endpoint paginado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '404': { $ref: '#/components/responses/Problem' }
  /conversations/{conversationId}/messages:
    get:
      tags: [Conversations]
      operationId: listConversationMessages
      summary: Listar histórico por cursor
      x-requirements: [US-002, FR-008, FR-024]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Página de mensagens do tenant corrente em ordem estável
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Conversations]
      operationId: sendMessage
      summary: Enfileirar mensagem humana
      x-requirements: [US-003, FR-010, FR-012, BR-005, BR-006]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AntiforgeryToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '202':
          description: Mensagem enfileirada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /conversations/{conversationId}/mode:
    put:
      tags: [Conversations]
      operationId: changeConversationMode
      summary: Alterar modo da conversa
      x-requirements: [US-003, FR-011, BR-003, BR-004, BR-010]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AntiforgeryToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeModeRequest'
      responses:
        '200':
          description: Modo alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSummary' }
        '409': { $ref: '#/components/responses/Problem' }
  /conversations/{conversationId}/messages/{messageId}/media:
    get:
      tags: [Conversations]
      operationId: downloadMessageMedia
      summary: Baixar mídia pelo proxy autenticado
      x-requirements: [US-002, FR-023, NFR-006]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Conteúdo transmitido pela API sem token ou URL privada da Meta
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }
  /knowledge-items:
    get:
      tags: [Knowledge]
      operationId: listKnowledgeItems
      summary: Listar itens de conhecimento
      x-requirements: [US-005, FR-017]
      responses:
        '200':
          description: Itens do tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KnowledgeItem' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Knowledge]
      operationId: createKnowledgeItem
      summary: Criar item de conhecimento
      x-requirements: [US-005, FR-017, FR-019]
      parameters:
        - $ref: '#/components/parameters/AntiforgeryToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeItemInput' }
      responses:
        '201':
          description: Item criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeItem' }
        '400': { $ref: '#/components/responses/Problem' }
  /knowledge-items/{itemId}:
    put:
      tags: [Knowledge]
      operationId: updateKnowledgeItem
      summary: Atualizar item de conhecimento
      x-requirements: [US-005, FR-017, FR-019]
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AntiforgeryToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeItemInput' }
      responses:
        '200':
          description: Item atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeItem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /knowledge-items/{itemId}/deactivate:
    post:
      tags: [Knowledge]
      operationId: deactivateKnowledgeItem
      summary: Desativar item de conhecimento
      x-requirements: [US-005, FR-017, FR-019]
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AntiforgeryToken'
      responses:
        '200':
          description: Item desativado e preservado para auditoria
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeItem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /integrations/whatsapp:
    put:
      tags: [Integrations]
      operationId: configureWhatsApp
      summary: Configurar credenciais WhatsApp do tenant
      x-requirements: [US-001, FR-004, FR-021, BR-008, BR-011]
      parameters:
        - $ref: '#/components/parameters/AntiforgeryToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WhatsAppConfigInput' }
      responses:
        '204': { description: Segredos protegidos e configuração salva }
        '400': { $ref: '#/components/responses/Problem' }
  /integrations/whatsapp/test:
    post:
      tags: [Integrations]
      operationId: testWhatsApp
      summary: Testar conexão WhatsApp
      x-requirements: [US-001, FR-021]
      parameters:
        - $ref: '#/components/parameters/AntiforgeryToken'
      responses:
        '200':
          description: Resultado sanitizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTest' }
        '400': { $ref: '#/components/responses/Problem' }
  /integrations/ai:
    put:
      tags: [Integrations]
      operationId: configureAi
      summary: Configurar credencial e modelo OpenAI
      x-requirements: [US-001, FR-004, FR-021, BR-008]
      parameters:
        - $ref: '#/components/parameters/AntiforgeryToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiConfigInput' }
      responses:
        '204': { description: Segredo protegido e configuração salva }
        '400': { $ref: '#/components/responses/Problem' }
  /integrations/ai/test:
    post:
      tags: [Integrations]
      operationId: testAi
      summary: Testar conexão OpenAI
      x-requirements: [US-001, FR-021]
      parameters:
        - $ref: '#/components/parameters/AntiforgeryToken'
      responses:
        '200':
          description: Resultado sanitizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTest' }
        '400': { $ref: '#/components/responses/Problem' }
  /usage:
    get:
      tags: [Usage]
      operationId: getUsage
      summary: Consultar unidades e custos estimados
      x-requirements: [US-006, FR-018, BR-007]
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Unidades e estimativas por provedor
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UsageSummary' }
        '400': { $ref: '#/components/responses/Problem' }
  /webhooks/whatsapp:
    get:
      tags: [Webhooks]
      operationId: verifyWhatsAppWebhook
      summary: Verificar challenge do webhook
      security: []
      x-requirements: [FR-005, BR-011]
      parameters:
        - in: query
          name: hub.mode
          required: true
          schema: { type: string }
        - in: query
          name: hub.verify_token
          required: true
          schema: { type: string }
        - in: query
          name: hub.challenge
          required: true
          schema: { type: string }
      responses:
        '200': { description: Challenge validado }
        '403': { description: Token inválido }
    post:
      tags: [Webhooks]
      operationId: receiveWhatsAppWebhook
      summary: Receber evento autenticado da Meta
      security: []
      x-requirements: [US-002, FR-005, FR-006, FR-007, FR-022, BR-011, NFR-001]
      parameters:
        - in: header
          name: X-Hub-Signature-256
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Evento aceito ou já conhecido }
        '401': { description: Assinatura inválida }
  /admin/webhook-events/unknown:
    get:
      tags: [Administration, Webhooks]
      operationId: listUnknownWebhookEvents
      summary: Listar eventos desconhecidos sanitizados
      x-requirements: [US-007, FR-002, FR-022]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Envelopes sanitizados; payload cifrado não é retornado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnknownWebhookEventPage' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/webhook-events/{eventId}/reprocess:
    post:
      tags: [Administration, Webhooks]
      operationId: reprocessUnknownWebhookEvent
      summary: Reprocessar evento desconhecido
      x-requirements: [US-007, FR-002, FR-019, FR-022]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/AntiforgeryToken'
      responses:
        '202': { description: Reprocessamento auditado e enfileirado }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-waai-session
  parameters:
    AntiforgeryToken:
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema: { type: string, minLength: 16 }
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema: { type: string }
    TenantId:
      in: path
      name: tenantId
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      in: path
      name: membershipId
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      in: path
      name: conversationId
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      in: path
      name: messageId
      required: true
      schema: { type: string, format: uuid }
    EventId:
      in: path
      name: eventId
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      in: query
      name: cursor
      schema: { type: string }
    PageLimit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    Problem:
      description: Erro no formato RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    AntiforgeryToken:
      type: object
      required: [token]
      properties:
        token: { type: string }
    ActivateAccountRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 32, maxLength: 512, writeOnly: true }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    CreateTenantRequest:
      type: object
      required: [name, slug, ownerEmail]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        ownerEmail: { type: string, format: email }
    ChangeTenantStatusRequest:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [Active, Suspended] }
        reason: { type: string, minLength: 1, maxLength: 250 }
    TenantSummary:
      type: object
      required: [id, name, slug, status, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [Active, Suspended] }
        version: { type: integer, minimum: 0 }
    TenantProvisioningResult:
      type: object
      required: [tenant, ownerInvitation]
      properties:
        tenant: { $ref: '#/components/schemas/TenantSummary' }
        ownerInvitation: { $ref: '#/components/schemas/InvitationIssued' }
    TenantPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TenantSummary' }
        nextCursor: { type: [string, 'null'] }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    CurrentSession:
      type: object
      required: [user, tenant, role, permissions]
      properties:
        user: { $ref: '#/components/schemas/SessionUser' }
        tenant:
          anyOf:
            - $ref: '#/components/schemas/SessionTenant'
            - type: 'null'
        role: { type: string, enum: [PlatformAdmin, TenantOwner, Operator] }
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
    SessionUser:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
    SessionTenant:
      type: object
      required: [id, name, slug, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [Active, Suspended] }
    OperatorInvitationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    InvitationIssued:
      type: object
      required: [membershipId, activationUrl, expiresAt]
      properties:
        membershipId: { type: string, format: uuid }
        activationUrl:
          type: string
          format: uri-reference
          description: Contém token em claro e é retornada uma única vez; nunca persistir ou registrar
        expiresAt: { type: string, format: date-time }
    OperatorSummary:
      type: object
      required: [membershipId, userId, email, status, version]
      properties:
        membershipId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [Invited, Active, Disabled] }
        version: { type: integer, minimum: 0 }
        invitationExpiresAt: { type: [string, 'null'], format: date-time }
    OperatorPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OperatorSummary' }
        nextCursor: { type: [string, 'null'] }
    ConversationMode:
      type: string
      enum: [Automatic, Human, Paused]
    ConversationSummary:
      type: object
      required: [id, contactName, mode, state, version, lastMessageAt]
      properties:
        id: { type: string, format: uuid }
        contactName: { type: string }
        phoneMasked: { type: string }
        mode: { $ref: '#/components/schemas/ConversationMode' }
        state: { type: string, enum: [Open, Closed] }
        version: { type: integer, minimum: 0 }
        serviceWindowExpiresAt: { type: [string, 'null'], format: date-time }
        lastMessageAt: { type: string, format: date-time }
    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConversationSummary' }
        nextCursor: { type: [string, 'null'] }
    ConversationDetail:
      allOf:
        - $ref: '#/components/schemas/ConversationSummary'
    Message:
      type: object
      required: [id, direction, senderType, type, status, occurredAt]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [Inbound, Outbound] }
        senderType: { type: string, enum: [Customer, Human, AI, System] }
        type: { type: string, enum: [Text, Image, Document, Audio, Unsupported] }
        text: { type: [string, 'null'] }
        media:
          anyOf:
            - $ref: '#/components/schemas/MediaMetadata'
            - type: 'null'
        status: { type: string, enum: [Received, Queued, Sent, Delivered, Read, Failed] }
        occurredAt: { type: string, format: date-time }
    MediaMetadata:
      type: object
      required: [downloadPath]
      properties:
        mimeType: { type: [string, 'null'] }
        fileName: { type: [string, 'null'] }
        sizeBytes: { type: [integer, 'null'], minimum: 0 }
        sha256: { type: [string, 'null'] }
        downloadPath:
          type: string
          description: Caminho relativo autenticado da API; nunca URL privada da Meta
    MessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        nextCursor: { type: [string, 'null'] }
    SendMessageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4096 }
    ChangeModeRequest:
      type: object
      required: [mode, reason]
      properties:
        mode: { $ref: '#/components/schemas/ConversationMode' }
        reason: { type: string, minLength: 1, maxLength: 250 }
    KnowledgeItem:
      allOf:
        - type: object
          required: [id, version]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
        - $ref: '#/components/schemas/KnowledgeItemInput'
    KnowledgeItemInput:
      type: object
      required: [title, content, isActive]
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        category: { type: [string, 'null'], maxLength: 80 }
        content: { type: string, minLength: 1, maxLength: 8000 }
        priority: { type: integer, minimum: 0, maximum: 100, default: 50 }
        isActive: { type: boolean }
    WhatsAppConfigInput:
      type: object
      required: [wabaId, phoneNumberId, accessToken]
      properties:
        wabaId: { type: string }
        phoneNumberId: { type: string }
        accessToken: { type: string, writeOnly: true }
    AiConfigInput:
      type: object
      required: [apiKey, model]
      properties:
        apiKey: { type: string, writeOnly: true }
        projectRef: { type: [string, 'null'] }
        model: { type: string }
    ConnectionTest:
      type: object
      required: [success, checkedAt]
      properties:
        success: { type: boolean }
        checkedAt: { type: string, format: date-time }
        errorCode: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
    UsageSummary:
      type: object
      required: [provider, metrics, disclaimer]
      properties:
        provider: { type: string, enum: [Meta, OpenAI] }
        metrics:
          type: array
          items:
            type: object
            required: [name, quantity, unit]
            properties:
              name: { type: string }
              quantity: { type: number }
              unit: { type: string }
        estimatedCostMinor: { type: [integer, 'null'] }
        currency: { type: [string, 'null'] }
        disclaimer: { type: string }
    UnknownWebhookEvent:
      type: object
      required: [id, provider, classification, status, receivedAt]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [Meta] }
        eventType: { type: [string, 'null'] }
        phoneNumberMasked: { type: [string, 'null'] }
        classification: { type: string }
        status: { type: string, enum: [Unknown, Dead, Ignored] }
        receivedAt: { type: string, format: date-time }
        lastErrorCode: { type: [string, 'null'] }
    UnknownWebhookEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UnknownWebhookEvent' }
        nextCursor: { type: [string, 'null'] }
    ProblemDetails:
      type: object
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }
security:
  - sessionCookie: []
