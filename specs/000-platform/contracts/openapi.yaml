openapi: 3.1.0
info:
  title: WhatsApp AI Manager API
  version: 0.1.0
  description: Contrato inicial do MVP. Endpoints autenticados usam sessão em cookie.
servers:
  - url: /api
tags:
  - name: Auth
  - name: Conversations
  - name: Knowledge
  - name: Integrations
  - name: Usage
  - name: Webhooks
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204': { description: Sessão iniciada }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        '204': { description: Sessão encerrada }
  /conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: mode
          schema: { $ref: '#/components/schemas/ConversationMode' }
        - in: query
          name: state
          schema: { type: string, enum: [Open, Closed] }
      responses:
        '200':
          description: Página de conversas do tenant corrente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '401': { $ref: '#/components/responses/Problem' }
  /conversations/{conversationId}:
    get:
      tags: [Conversations]
      operationId: getConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversa e mensagens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '404': { $ref: '#/components/responses/Problem' }
  /conversations/{conversationId}/messages:
    post:
      tags: [Conversations]
      operationId: sendMessage
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '202':
          description: Mensagem enfileirada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /conversations/{conversationId}/mode:
    put:
      tags: [Conversations]
      operationId: changeConversationMode
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeModeRequest'
      responses:
        '200':
          description: Modo alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSummary' }
        '409': { $ref: '#/components/responses/Problem' }
  /knowledge-items:
    get:
      tags: [Knowledge]
      operationId: listKnowledgeItems
      responses:
        '200':
          description: Itens do tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KnowledgeItem' }
    post:
      tags: [Knowledge]
      operationId: createKnowledgeItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeItemInput' }
      responses:
        '201':
          description: Item criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeItem' }
  /knowledge-items/{itemId}:
    put:
      tags: [Knowledge]
      operationId: updateKnowledgeItem
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeItemInput' }
      responses:
        '200':
          description: Item atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeItem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Knowledge]
      operationId: deleteKnowledgeItem
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Item removido }
  /integrations/whatsapp:
    put:
      tags: [Integrations]
      operationId: configureWhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WhatsAppConfigInput' }
      responses:
        '204': { description: Segredos protegidos e configuração salva }
  /integrations/whatsapp/test:
    post:
      tags: [Integrations]
      operationId: testWhatsApp
      responses:
        '200':
          description: Resultado sanitizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTest' }
  /integrations/ai:
    put:
      tags: [Integrations]
      operationId: configureAi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiConfigInput' }
      responses:
        '204': { description: Segredo protegido e configuração salva }
  /integrations/ai/test:
    post:
      tags: [Integrations]
      operationId: testAi
      responses:
        '200':
          description: Resultado sanitizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTest' }
  /usage:
    get:
      tags: [Usage]
      operationId: getUsage
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Unidades e estimativas por provedor
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UsageSummary' }
  /webhooks/whatsapp:
    get:
      tags: [Webhooks]
      operationId: verifyWhatsAppWebhook
      security: []
      parameters:
        - in: query
          name: hub.mode
          required: true
          schema: { type: string }
        - in: query
          name: hub.verify_token
          required: true
          schema: { type: string }
        - in: query
          name: hub.challenge
          required: true
          schema: { type: string }
      responses:
        '200': { description: Challenge validado }
        '403': { description: Token inválido }
    post:
      tags: [Webhooks]
      operationId: receiveWhatsAppWebhook
      security: []
      parameters:
        - in: header
          name: X-Hub-Signature-256
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Evento aceito ou já conhecido }
        '401': { description: Assinatura inválida }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-waai-session
  parameters:
    ConversationId:
      in: path
      name: conversationId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    Problem:
      description: Erro no formato RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    ConversationMode:
      type: string
      enum: [Automatic, Human, Paused]
    ConversationSummary:
      type: object
      required: [id, contactName, mode, state, version, lastMessageAt]
      properties:
        id: { type: string, format: uuid }
        contactName: { type: string }
        phoneMasked: { type: string }
        mode: { $ref: '#/components/schemas/ConversationMode' }
        state: { type: string, enum: [Open, Closed] }
        version: { type: integer, minimum: 0 }
        serviceWindowExpiresAt: { type: [string, 'null'], format: date-time }
        lastMessageAt: { type: string, format: date-time }
    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConversationSummary' }
        nextCursor: { type: [string, 'null'] }
    ConversationDetail:
      allOf:
        - $ref: '#/components/schemas/ConversationSummary'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items: { $ref: '#/components/schemas/Message' }
    Message:
      type: object
      required: [id, direction, senderType, type, status, occurredAt]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [Inbound, Outbound] }
        senderType: { type: string, enum: [Customer, Human, AI, System] }
        type: { type: string, enum: [Text, Image, Document, Audio, Unsupported] }
        text: { type: [string, 'null'] }
        status: { type: string, enum: [Received, Queued, Sent, Delivered, Read, Failed] }
        occurredAt: { type: string, format: date-time }
    SendMessageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4096 }
    ChangeModeRequest:
      type: object
      required: [mode, reason]
      properties:
        mode: { $ref: '#/components/schemas/ConversationMode' }
        reason: { type: string, minLength: 1, maxLength: 250 }
    KnowledgeItem:
      allOf:
        - type: object
          required: [id, version]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
        - $ref: '#/components/schemas/KnowledgeItemInput'
    KnowledgeItemInput:
      type: object
      required: [title, content, isActive]
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        category: { type: [string, 'null'], maxLength: 80 }
        content: { type: string, minLength: 1, maxLength: 8000 }
        priority: { type: integer, minimum: 0, maximum: 100, default: 50 }
        isActive: { type: boolean }
    WhatsAppConfigInput:
      type: object
      required: [wabaId, phoneNumberId, accessToken, verifyToken]
      properties:
        wabaId: { type: string }
        phoneNumberId: { type: string }
        accessToken: { type: string, writeOnly: true }
        verifyToken: { type: string, writeOnly: true }
    AiConfigInput:
      type: object
      required: [apiKey, model]
      properties:
        apiKey: { type: string, writeOnly: true }
        projectRef: { type: [string, 'null'] }
        model: { type: string }
    ConnectionTest:
      type: object
      required: [success, checkedAt]
      properties:
        success: { type: boolean }
        checkedAt: { type: string, format: date-time }
        errorCode: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
    UsageSummary:
      type: object
      required: [provider, metrics, disclaimer]
      properties:
        provider: { type: string, enum: [Meta, OpenAI] }
        metrics:
          type: array
          items:
            type: object
            required: [name, quantity, unit]
            properties:
              name: { type: string }
              quantity: { type: number }
              unit: { type: string }
        estimatedCost: { type: [number, 'null'] }
        currency: { type: [string, 'null'] }
        disclaimer: { type: string }
    ProblemDetails:
      type: object
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }
security:
  - sessionCookie: []
