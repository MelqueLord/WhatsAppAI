name: Staging smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Real integrations smoke test
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      STAGING_QR_LINE_NUMBER: ${{ vars.STAGING_QR_LINE_NUMBER }}
      STAGING_EMAIL: ${{ secrets.STAGING_EMAIL }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web

      - name: Validate staging integrations
        run: node scripts/staging-smoke.mjs
        working-directory: apps/web
