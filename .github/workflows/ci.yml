name: CI

on:
  push:
    branches: [master, 000-platform]
  pull_request:
    branches: [master, 000-platform]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4-lts
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: whatsappai_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=15s

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DatabaseProvider: MySQL
      ConnectionStrings__DefaultConnection: "Server=localhost;Port=3306;Database=whatsappai_test;User=root;Password=root;CharSet=utf8mb4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Restore .NET
        run: dotnet restore

      - name: Restore frontend
        run: npm ci
        working-directory: apps/web

      - name: Check whitespace
        run: git diff --check

      - name: Build .NET
        run: dotnet build --no-restore --configuration Release

      - name: Build frontend
        run: npm run build
        working-directory: apps/web

      - name: Lint frontend
        run: npm run lint
        working-directory: apps/web

      - name: Test .NET
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Test frontend
        run: npm test
        working-directory: apps/web
